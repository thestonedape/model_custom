# Smoke-test config for the raw fixation-level multimodal baseline.

data:
  cache_path: "data/cache/raw_fixation_preview_nr2.pkl"
  vocab_path: "data/vocabulary_top500_nr_tsr_mixed.pkl"
  splits_path: "data/sentence_splits_nr_tsr_mixed.pkl"
  tasks: ["task2-NR-2.0"]

model:
  eeg_dim: 105
  et_dim: 4
  metrics_dim: 5
  model_dim: 128
  et_hidden_dim: 32
  aux_hidden_dim: 32
  num_heads: 4
  num_layers: 2
  ff_dim: 256
  dropout: 0.1
  num_classes: 500
  norm_first: false

training:
  epochs: 1
  batch_size: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  max_train_batches: 2

evaluation:
  batch_size: 4
  max_eval_batches: 1
  metrics: ["top1", "top5", "top10"]

logging:
  log_interval: 1

experiments:
  save_dir: "results/raw_multimodal_preview"

hardware:
  device: "cuda"
  num_workers: 0
