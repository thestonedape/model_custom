# First trainable raw fixation-level EEG + ET baseline.

data:
  cache_paths:
    - "data/cache/raw_fixation_task2_NR.pkl"
    - "data/cache/raw_fixation_task2_NR_2_0_part1.pkl"
    - "data/cache/raw_fixation_task2_NR_2_0_part2.pkl"
    - "data/cache/raw_fixation_task2_NR_2_0_part3.pkl"
    - "data/cache/raw_fixation_task3_TSR.pkl"
    - "data/cache/raw_fixation_task3_TSR_2_0_part1.pkl"
    - "data/cache/raw_fixation_task3_TSR_2_0_part2a.pkl"
    - "data/cache/raw_fixation_task3_TSR_2_0_part2b.pkl"
    - "data/cache/raw_fixation_task3_TSR_2_0_part3a.pkl"
    - "data/cache/raw_fixation_task3_TSR_2_0_part3b.pkl"
  vocab_path: "data/vocabulary_top500_nr_tsr_mixed.pkl"
  splits_path: "data/sentence_splits_nr_tsr_mixed.pkl"
  tasks: ["task2-NR", "task2-NR-2.0", "task3-TSR", "task3-TSR-2.0"]

model:
  eeg_dim: 105
  et_dim: 4
  metrics_dim: 5
  model_dim: 256
  et_hidden_dim: 64
  aux_hidden_dim: 64
  num_heads: 8
  num_layers: 3
  ff_dim: 512
  dropout: 0.1
  num_classes: 500
  norm_first: false

training:
  epochs: 20
  batch_size: 32
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0

evaluation:
  batch_size: 16
  min_batch_size: 4
  metrics: ["top1", "top5", "top10"]

logging:
  log_interval: 10

experiments:
  save_dir: "results/raw_multimodal_mixed"

hardware:
  device: "cuda"
  num_workers: 0
