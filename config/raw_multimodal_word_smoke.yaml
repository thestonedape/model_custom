# Grouped word-level raw EEG + ET smoke test on one shard.

data:
  cache_paths:
    - "data/cache/raw_word_task2_NR_2_0_part1.pkl"
  vocab_path: "data/vocabulary_top500_nr_tsr_mixed.pkl"
  splits_path: "data/sentence_splits_nr_tsr_mixed.pkl"
  tasks: ["task2-NR-2.0"]
  normalize_eeg: true
  normalize_et: true
  normalization_eps: 1.0e-5

model:
  eeg_dim: 105
  et_dim: 4
  metrics_dim: 5
  model_dim: 192
  et_hidden_dim: 64
  aux_hidden_dim: 64
  num_heads: 6
  num_layers: 3
  ff_dim: 384
  dropout: 0.1
  num_classes: 500
  norm_first: false
  patch_kernel_size: 7
  patch_stride: 4

training:
  epochs: 1
  batch_size: 8
  learning_rate: 1.0e-4
  weight_decay: 1.0e-2
  grad_clip: 1.0
  max_train_batches: 20

evaluation:
  batch_size: 8
  min_batch_size: 2
  metrics: ["top1", "top5", "top10"]

logging:
  log_interval: 5

experiments:
  save_dir: "results/raw_multimodal_word_smoke"

hardware:
  device: "cuda"
  num_workers: 0
